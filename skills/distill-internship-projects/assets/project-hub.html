<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'">
<title>项目素材库 · JD-Make-Helper</title>
<style>
:root{color-scheme:light;--ink:#17243c;--muted:#64748b;--line:#dfe6ee;--blue:#295bd6;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{background:#142641;color:white;padding:35px max(28px,calc((100vw - 1180px)/2));border-bottom:4px solid #6d95ff}h1{font-size:29px;margin:5px 0 10px}header p{color:#c5d1e3;max-width:850px;margin:0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#92b7ff}main{max-width:1236px;padding:28px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat,.filters,.card,.notice{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:15px 20px}.stat strong{font-size:28px;display:block}.stat span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:12px;align-items:end;padding:18px;flex-wrap:wrap;position:sticky;top:0;z-index:1;box-shadow:0 5px 18px #10234308}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:6px;background:white;color:var(--ink);padding:9px 12px}input{min-width:260px}button{background:var(--blue);color:white;border-color:var(--blue);cursor:pointer}.check{flex-direction:row;align-items:center;padding-bottom:10px}.check input{min-width:0}.notice{padding:12px 18px;color:#765622;background:#fffaf0;margin:20px 0;font-size:13px}.results{display:grid;gap:16px}.card{padding:22px 24px}.card h2{font-size:19px;margin:8px 0 10px}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.project{font-weight:700;color:var(--blue)}.tag{border-radius:4px;padding:2px 8px;background:#eef2f7;color:#54627a}.warn{background:#fff0d7;color:#8d5b08}.ok{background:#e2f6ee;color:#196446}.summary{margin:0 0 15px;white-space:pre-wrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}.details p{margin:0;font-size:13px}.details b{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-bottom:3px}details{margin-top:14px;font-size:12px}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:12px;border-radius:6px;font:12px/1.7 ui-monospace,monospace}.origin{overflow-wrap:anywhere;color:var(--muted);margin-top:12px}.empty{text-align:center;padding:50px;color:var(--muted)}footer{color:var(--muted);font-size:12px;padding:25px 0}.result-label{font-size:13px;color:var(--muted);margin:20px 0 12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}main{padding:16px}.filters{position:static}input{min-width:0;width:100%}.filters label{width:100%}.filters .check{width:auto}header{padding:26px 20px}.card{padding:17px}}
</style></head><body>
<header><div class="eyebrow">JD-MAKE-HELPER / LOCAL EVIDENCE HUB</div><h1>把项目进展，留成可复用的经历</h1><p>按项目检索关键节点，展开查看原始依据。项目进展、个人贡献与验证范围分别保留，为下一次简历润色提供可靠素材。</p></header>
<main><section class="stats" id="stats" aria-label="素材统计"></section>
<section class="filters" aria-label="筛选条件"><label>搜索节点与证据<input id="query" type="search" placeholder="输入项目、技术、问题或结果…"></label><label>项目<select id="project" aria-label="项目"><option value="">全部项目</option></select></label><label>表述状态<select id="status" aria-label="表述状态"><option value="">全部状态</option><option>待确认</option><option>已确认</option><option>计划</option><option>不采用</option><option>来源待复核</option></select></label><label class="check"><input id="history" type="checkbox">显示已被修正的节点</label><button id="download" type="button">导出筛选结果</button></section>
<aside class="notice" id="coverage"></aside><div class="result-label" id="count" aria-live="polite"></div><section class="results" id="results"></section><footer id="footer"></footer></main>
<script type="application/json" id="hub-data">__PROJECT_HUB_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('hub-data').textContent), names=Object.fromEntries(data.projects.map(p=>[p.id,p.name]));
const $=id=>document.getElementById(id);function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
const active=data.milestones.filter(n=>!n.superseded_by);[['项目',data.projects.length],['关键节点',active.length],['来源快照',data.snapshot_count],['个人表述待确认',active.filter(n=>n.status!=='已确认'||n.needs_review).length]].forEach(([label,num])=>{const n=el('div',undefined,'stat');n.append(el('strong',num),el('span',label));$('stats').append(n)});
data.projects.forEach(p=>{const o=el('option',p.name);o.value=p.id;$('project').append(o)});
const warnings=data.last_collection?.projects.flatMap(p=>p.warnings)||[];$('coverage').textContent='采集边界：仅配置中指定的本地文字、聊天导出与限定范围的 Git 历史。文档陈述与提交记录不等于本人完成或生产验收。'+(warnings.length?'本次有 '+warnings.length+' 条覆盖提示，可在导出的 hub.json 查看。':'');
let visible=[];function render(){const q=$('query').value.trim().toLocaleLowerCase(),p=$('project').value,s=$('status').value;visible=data.milestones.filter(n=>($('history').checked||!n.superseded_by)&&(!p||n.project_id===p)&&(!s||(s==='来源待复核'?n.needs_review:n.status===s))&&(!q||(JSON.stringify(n)+' '+names[n.project_id]).toLocaleLowerCase().includes(q)));$('results').replaceChildren();$('count').textContent='显示 '+visible.length+' 个节点 · 事件日期未知的节点单独保留';visible.forEach(n=>{const card=el('article',undefined,'card'),meta=el('div',undefined,'meta');meta.append(el('span',names[n.project_id],'project'),el('span',n.date||'事件日期未确认'),el('span',n.kind,'tag'),el('span',n.status,n.status==='已确认'?'tag ok':'tag'));if(n.needs_review)meta.append(el('span','来源更新，待复核','tag warn'));if(n.superseded_by)meta.append(el('span','已由 '+n.superseded_by+' 修正','tag warn'));card.append(meta,el('h2',n.title),el('p',n.summary,'summary'));const info=el('div',undefined,'details');[['交付阶段',n.stage],['个人贡献与边界',n.ownership],['验证范围',n.verification],['稳定节点 ID',n.id+' · 版本 '+n.revision]].forEach(([k,v])=>{const x=el('p');x.append(el('b',k),el('span',v));info.append(x)});card.append(info);const details=el('details');details.append(el('summary','查看 '+n.evidence.length+' 处来源与原文'));n.evidence.forEach(r=>{details.append(el('div',r.kind+' · '+r.origin+' · '+r.snapshot_id+':L'+r.start_line+'–L'+r.end_line+(r.outdated?' · 此快照已不是当前版本':''),'origin'),el('pre',r.excerpt))});card.append(details);$('results').append(card)});if(!visible.length)$('results').append(el('div','没有匹配节点。可以调整筛选，或先采集材料并导入压缩后的节点。','empty'))}
['query','project','status','history'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({schema_version:data.schema_version,generated_at:data.generated_at,milestones:visible},null,2)],{type:'application/json;charset=utf-8'}));const a=el('a');a.href=url;a.download='project-milestones.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('footer').textContent='本地生成于 '+new Date(data.generated_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'（北京时间）'+' · 页面不发起网络请求。数据以 SQLite 素材库为准；再次导出后刷新此页。';render();
</script></body></html>
